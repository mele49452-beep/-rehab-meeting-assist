<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>リハビリ会議アシスト</title>

<style>

*{box-sizing:border-box}

body{

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

  background:#f4f6f8;

  margin:0;

  color:#222;

}

header{

  background:#0b6efd;

  color:white;

  padding:28px 18px;

}

header h1{

  margin:0 0 8px;

  font-size:30px;

}

header p{

  margin:0;

  font-size:17px;

}

main{

  max-width:760px;

  margin:auto;

  padding:14px;

}

.card{

  background:white;

  border-radius:16px;

  padding:18px;

  margin:12px 0;

  box-shadow:0 2px 10px #0001;

}

h2{

  margin-top:0;

}

label{

  display:block;

  font-weight:700;

  margin:12px 0 6px;

}

input,textarea{

  width:100%;

  padding:12px;

  border:1px solid #ccc;

  border-radius:10px;

  font:inherit;

  background:white;

}

textarea{

  min-height:180px;

  resize:vertical;

}

button{

  padding:13px 16px;

  border:0;

  border-radius:10px;

  margin:4px;

  font-weight:700;

  font-size:16px;

}

.primary{

  background:#0b6efd;

  color:white;

}

.secondary{

  background:#e9eef7;

  color:#1f2937;

}

button:disabled{

  opacity:.45;

}

.status{

  padding:12px;

  background:#eef2ff;

  border-radius:10px;

  margin-bottom:10px;

}

.hint{

  font-size:13px;

  color:#64748b;

  line-height:1.5;

}

.privacy{

  font-size:13px;

  color:#334155;

  background:#f8fafc;

  border-radius:10px;

  padding:12px;

  line-height:1.5;

}

.row{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.result{

  min-height:500px;

  white-space:pre-wrap;

  line-height:1.8;

  font-size:16px;

}

@media(max-width:600px){

  .row{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<header>

<h1>リハビリ会議アシスト</h1>

<p>🎙️ 録音・会議整理テスト版</p>

</header>

<main>

<!-- 録音 -->

<section class="card">

<h2>🎙️ マイク録音</h2>

<div id="status" class="status">準備OK</div>

<button id="start" class="primary">録音開始</button>

<button id="stop" disabled>録音停止</button>

<audio id="audio" controls hidden style="width:100%;margin-top:12px"></audio>

<p class="hint">

SafariでHTTPSのページとして開き、録音開始時にマイクの使用を「許可」してください。

</p>

<p class="privacy">

🔒 現在のテスト版では、録音データや会議内容を外部サーバーへアップロードする処理は入れていません。

</p>

</section>

<!-- 会議情報 -->

<section class="card">

<h2>👤 会議情報</h2>

<div class="row">

<div>

<label for="name">利用者</label>

<input id="name" placeholder="例：Aさん">

</div>

<div>

<label for="date">会議日</label>

<input id="date" type="date">

</div>

</div>

<label for="staff">参加者</label>

<input id="staff" placeholder="例：PT、OT、看護師、介護職、ケアマネ">

</section>

<!-- 会議内容 -->

<section class="card">

<h2>📝 会議内容</h2>

<textarea

id="text"

placeholder="会議内容・文字起こし結果をここに入力します"

></textarea>

<p class="hint">

※現在は外部AIを使わないテスト版です。入力内容はこのブラウザ内で整理します。

</p>

<button id="summarize" class="primary">

会議内容を整理する

</button>

<button id="clear" class="secondary">

クリア

</button>

</section>

<!-- 会議録 -->

<section class="card">

<h2>📋 リハビリ会議録</h2>

<p class="hint">

整理後の文章は、必要に応じて自由に修正できます。

</p>

<textarea

id="summary"

class="result"

placeholder="ここに会議録が表示されます"

></textarea>

<br>

<button id="copy" class="secondary">

結果をコピー

</button>

<span id="copied" class="hint"></span>

</section>

</main>

<script>

let recorder=null;

let stream=null;

let chunks=[];

let recordedUrl=null;

const $=id=>document.getElementById(id);

/* =========================

   録音

========================= */

function getSupportedMimeType(){

 const types=[

   "audio/mp4",

   "audio/mp4;codecs=mp4a.40.2",

   "audio/webm;codecs=opus",

   "audio/webm"

 ];

 return types.find(

   type =>

   typeof MediaRecorder.isTypeSupported==="function" &&

   MediaRecorder.isTypeSupported(type)

 ) || "";

}

$("start").onclick=async()=>{

 try{

   if(!navigator.mediaDevices?.getUserMedia){

     throw new Error("HTTPSで公開されたページではありません");

   }

   if(!window.MediaRecorder){

     throw new Error("このブラウザは録音機能に対応していません");

   }

   stream=await navigator.mediaDevices.getUserMedia({

     audio:true

   });

   chunks=[];

   const mimeType=getSupportedMimeType();

   recorder=mimeType

     ? new MediaRecorder(stream,{mimeType})

     : new MediaRecorder(stream);

   recorder.ondataavailable=e=>{

     if(e.data && e.data.size){

       chunks.push(e.data);

     }

   };

   recorder.onerror=()=>{

     $("status").textContent=

       "録音中にエラーが発生しました。";

   };

   recorder.onstop=()=>{

     const type=

       recorder.mimeType ||

       mimeType ||

       "audio/mp4";

     const blob=new Blob(chunks,{type});

     if(recordedUrl){

       URL.revokeObjectURL(recordedUrl);

     }

     recordedUrl=URL.createObjectURL(blob);

     const audio=$("audio");

     audio.pause();

     audio.src=recordedUrl;

     audio.hidden=false;

     audio.load();

     stream?.getTracks().forEach(

       track=>track.stop()

     );

     stream=null;

     $("status").textContent=

       "録音完了。下の再生ボタンで確認できます。";

   };

   recorder.start();

   $("start").disabled=true;

   $("stop").disabled=false;

   $("status").textContent=

     "🔴 録音中です…";

 }catch(e){

   stream?.getTracks().forEach(

     track=>track.stop()

   );

   stream=null;

   $("status").textContent=

     "マイクを開始できませんでした："+e.message;

   alert(

     "SafariでHTTPSのページを開き、マイクの使用を許可してください。"

   );

 }

};

$("stop").onclick=()=>{

 if(recorder?.state==="recording"){

   $("status").textContent=

     "録音を停止しています…";

   recorder.stop();

   $("start").disabled=false;

   $("stop").disabled=true;

 }

};

/* =========================

   会議内容の整理

========================= */

/*

  同じ文章が複数の項目に入らないように、

  1つの文章を優先順位の高い項目へ

  1回だけ分類する。

*/

function classifyLine(line){

 const text=line.trim();

 if(!text) return null;

 /* 希望 */

 if(

   /希望|したい|行きたい|本人は|家族も|家族は/.test(text)

 ){

   return "wish";

 }

 /* 専門職 */

 if(

   /PT|OT|ST|理学療法|作業療法|言語聴覚|看護師|介護職|ケアマネ|リハビリ/.test(text)

 ){

   return "professional";

 }

 /* 課題・リスク */

 if(

   /課題|リスク|ふらつ|転倒|不安|困って|困り|問題|低下|見守り|注意が必要/.test(text)

 ){

   return "issue";

 }

 /* 外出 */

 if(

   /外出|買い物|スーパー|バス|タクシー|送迎|家族の車|自動車|徒歩/.test(text)

 ){

   return "outing";

 }

 /* 目標・方針 */

 if(

   /目標|方針|今後|継続|支援|訓練/.test(text)

 ){

   return "plan";

 }

 /* 生活・身体 */

 if(

   /歩行|歩け|立ち上が|食事|入浴|着替|トイレ|ADL|認知|血圧|身体|状態|自立/.test(text)

 ){

   return "current";

 }

 return "other";

}

$("summarize").onclick=()=>{

 const text=$("text").value.trim();

 if(!text){

   alert("先に会議内容を入力してください。");

   return;

 }

 const sections={

   current:[],

   wish:[],

   professional:[],

   issue:[],

   plan:[],

   outing:[],

   other:[]

 };

 const lines=text

   .split(/\n+/)

   .map(x=>x.trim())

   .filter(Boolean);

 /* 1文につき1分類 */

 lines.forEach(line=>{

   const category=classifyLine(line);

   if(category){

     sections[category].push(line);

   }

 });

 /* 外出関連をまとめる */

 const outingLines=[

   ...sections.outing

 ];

 /* 「外出」が含まれる他項目も外出へ */

 sections.current=sections.current.filter(line=>{

   if(/外出|買い物|スーパー|家族の車|バス|タクシー|送迎|徒歩/.test(line)){

     outingLines.push(line);

     return false;

   }

   return true;

 });

 /* 目標関連 */

 const planLines=[

   ...sections.plan

 ];

 /* 重複削除 */

 function unique(arr){

   return [...new Set(arr)];

 }

 const current=unique(sections.current);

 const wish=unique(sections.wish);

 const professional=unique(sections.professional);

 const issue=unique(sections.issue);

 const plan=unique(planLines);

 const outing=unique(outingLines);

 const other=unique(sections.other);

 /* 外出頻度 */

 let frequency="要確認";

 const freqMatch=text.match(

   /(週[0-9０-９一二三四五六七回]+回程度|週[0-9０-９]+回|月[0-9０-９]+回程度|毎日)/

 );

 if(freqMatch){

   frequency=freqMatch[0];

 }

 /* 外出手段 */

 let transport="要確認";

 const transportMatch=text.match(

   /(家族の車|自家用車|車|バス|タクシー|送迎|徒歩)/

 );

 if(transportMatch){

   transport=transportMatch[0];

 }

 function show(arr){

   return arr.length

     ? arr.map(x=>"・"+x).join("\n")

     : "要確認";

 }

 const result=

`【リハビリテーション会議録】

利用者：${$("name").value||"—"}

会議日：${$("date").value||"—"}

参加者：${$("staff").value||"—"}

【1．現在の生活・身体状況】

${show(current)}

【2．本人・家族の希望】

${show(wish)}

【3．専門職からの意見】

${show(professional)}

【4．生活上の課題・リスク】

${show(issue)}

【5．目標・今後の方針】

${show(plan)}

【6．外出・地域生活】

外出頻度：${frequency}

外出手段：${transport}

${outing.length ? outing.map(x=>"・"+x).join("\n") : "・要確認"}

【7．次回までの確認事項】

・課題・リスクの変化を確認

・本人・家族の希望に対する進捗を確認

・各専門職の支援内容と経過を確認

・身体機能・ADLの変化を確認

${other.length ? "\n【その他】\n"+show(other) : ""}

※この会議録は入力内容を自動分類した下書きです。

正式な記録として使用する前に、元の会議内容と照合・確認してください。`;

 $("summary").value=result;

 /* 会議録の場所まで自動スクロール */

 $("summary").scrollIntoView({

   behavior:"smooth",

   block:"start"

 });

};

/* =========================

   クリア

========================= */

$("clear").onclick=()=>{

 $("text").value="";

 $("summary").value="";

};

/* =========================

   コピー

========================= */

$("copy").onclick=async()=>{

 const text=$("summary").value;

 if(!text){

   alert("先に会議録を作成してください。");

   return;

 }

 try{

   await navigator.clipboard.writeText(text);

   $("copied").textContent=

     " コピーしました";

   setTimeout(()=>{

     $("copied").textContent="";

   },1800);

 }catch(e){

   alert("コピーできませんでした。");

 }

};

</script>

</body>

</html>
