<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リハビリ会議アシスト</title><style>body{font-family:-apple-system,sans-serif;background:#f4f6f8;margin:0;color:#222}header{background:#0b6efd;color:white;padding:22px 18px}main{max-width:720px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}button{padding:13px 16px;border:0;border-radius:10px;margin:4px;font-weight:700;font-size:16px}.primary{background:#0b6efd;color:white}.status{padding:12px;background:#eef2ff;border-radius:10px;margin-bottom:10px}.hint{font-size:13px;color:#64748b;line-height:1.5}</style></head><body><header><h1>リハビリ会議アシスト</h1><p>🎙️ 録音テスト版</p></header><main><section class="card"><h2>🎙️ マイク録音</h2><div id="status" class="status">準備OK</div><button id="start" class="primary">録音開始</button><button id="stop" disabled>録音停止</button><audio id="audio" controls hidden style="width:100%;margin-top:12px"></audio><p class="hint">SafariでHTTPSのページとして開いた場合、録音開始時にマイク許可が表示されます。「許可」を選んでください。</p></section><section class="card"><h2>📝 会議内容</h2><textarea id="text" rows="10" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit" placeholder="ここに会議内容を入力できます"></textarea></section></main><script>let recorder=null,stream=null,chunks=[];const $=id=>document.getElementById(id);$("start").onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error("HTTPSで公開されたページではありません");stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{$("audio").src=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"}));$("audio").hidden=false;stream.getTracks().forEach(t=>t.stop());$("status").textContent="録音停止しました。再生できます。"};recorder.start();$("start").disabled=true;$("stop").disabled=false;$("status").textContent="🔴 録音中です…"}catch(e){$("status").textContent="マイクを開始できませんでした："+e.message;alert("SafariでHTTPSのページを開き、マイクの使用を許可してください。")}};$("stop").onclick=()=>{if(recorder?.state==="recording"){recorder.stop();$("start").disabled=false;$("stop").disabled=true}};</script></body></html>
