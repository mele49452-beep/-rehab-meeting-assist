<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>リハビリ会議アシスト</title>

<style>

*{box-sizing:border-box}

body{

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

  background:#f4f6f8;

  margin:0;

  color:#222;

}

header{

  background:#0b6efd;

  color:#fff;

  padding:28px 18px;

}

header h1{

  margin:0 0 8px;

  font-size:30px;

}

header p{

  margin:0;

  font-size:17px;

}

main{

  max-width:760px;

  margin:auto;

  padding:14px;

}

.card{

  background:#fff;

  border-radius:16px;

  padding:18px;

  margin:12px 0;

  box-shadow:0 2px 10px #0001;

}

h2{

  margin-top:0;

}

label{

  display:block;

  font-weight:700;

  margin:12px 0 6px;

}

input,

textarea{

  width:100%;

  padding:12px;

  border:1px solid #ccc;

  border-radius:10px;

  font:inherit;

  background:#fff;

}

textarea{

  min-height:180px;

  resize:vertical;

}

button{

  padding:13px 16px;

  border:0;

  border-radius:10px;

  margin:4px;

  font-weight:700;

  font-size:16px;

}

.primary{

  background:#0b6efd;

  color:#fff;

}

.secondary{

  background:#e9eef7;

  color:#1f2937;

}

button:disabled{

  opacity:.45;

}

.status{

  padding:12px;

  background:#eef2ff;

  border-radius:10px;

  margin-bottom:10px;

}

.hint{

  font-size:13px;

  color:#64748b;

  line-height:1.5;

}

.privacy{

  font-size:13px;

  color:#334155;

  background:#f8fafc;

  border-radius:10px;

  padding:12px;

  line-height:1.5;

}

.summary{

  white-space:pre-wrap;

  background:#f8fafc;

  border-radius:10px;

  padding:14px;

  line-height:1.8;

  min-height:180px;

}

.row{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.badge{

  display:inline-block;

  padding:4px 8px;

  border-radius:999px;

  background:#e8f1ff;

  color:#0759c7;

  font-size:12px;

  font-weight:700;

  margin-bottom:8px;

}

@media(max-width:600px){

  .row{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<header>

<h1>リハビリ会議アシスト</h1>

<p>🎙️ 録音・会議整理テスト版</p>

</header>

<main>

<section class="card">

<h2>🎙️ マイク録音</h2>

<div id="status" class="status">

準備OK

</div>

<button id="start" class="primary">

録音開始

</button>

<button id="stop" disabled>

録音停止

</button>

<audio

id="audio"

controls

hidden

style="width:100%;margin-top:12px">

</audio>

<p class="hint">

SafariでHTTPSのページとして開き、録音開始時にマイクの使用を「許可」してください。

</p>

<p class="privacy">

🔒 現在の録音はこのページ内で再生するだけです。

外部サーバーへアップロードする処理は入れていません。

</p>

</section>

<section class="card">

<h2>👤 会議情報</h2>

<div class="row">

<div>

<label for="name">

利用者

</label>

<input

id="name"

placeholder="例：Aさん">

</div>

<div>

<label for="date">

会議日

</label>

<input

id="date"

type="date">

</div>

</div>

<label for="staff">

参加者

</label>

<input

id="staff"

placeholder="例：PT、OT、看護師、介護職、ケアマネ">

</section>

<section class="card">

<h2>📝 会議内容</h2>

<textarea

id="text"

placeholder="会議内容・文字起こし結果をここに入力します"></textarea>

<p class="hint">

※現在は外部AIを使わないテスト版です。

入力内容はこのブラウザ内で整理します。

</p>

<button id="summarize" class="primary">

会議内容を整理する

</button>

<button id="clear" class="secondary">

クリア

</button>

</section>

<section class="card">

<h2>📋 リハビリ会議録（案）</h2>

<div class="badge">

分類・重複を減らした下書き

</div>

<div id="summary" class="summary">

ここに整理結果が表示されます。

</div>

<button id="copy" class="secondary">

結果をコピー

</button>

<span id="copied" class="hint"></span>

</section>

</main>

<script>

let recorder=null;

let stream=null;

let chunks=[];

let recordedUrl=null;

const $=id=>document.getElementById(id);

function getSupportedMimeType(){

const types=[

"audio/mp4",

"audio/mp4;codecs=mp4a.40.2",

"audio/webm;codecs=opus",

"audio/webm"

];

return types.find(

type=>

typeof MediaRecorder.isTypeSupported==="function"

&&

MediaRecorder.isTypeSupported(type)

)||"";

}

$("start").onclick=async()=>{

try{

if(!navigator.mediaDevices?.getUserMedia){

throw new Error(

"HTTPSで公開されたページではありません"

);

}

if(!window.MediaRecorder){

throw new Error(

"このブラウザは録音機能に対応していません"

);

}

stream=

await navigator.mediaDevices.getUserMedia({

audio:true

});

chunks=[];

const mimeType=

getSupportedMimeType();

recorder=

mimeType

?

new MediaRecorder(

stream,

{mimeType}

)

:

new MediaRecorder(stream);

recorder.ondataavailable=e=>{

if(e.data&&e.data.size){

chunks.push(e.data);

}

};

recorder.onerror=()=>{

$("status").textContent=

"録音中にエラーが発生しました。";

};

recorder.onstop=()=>{

const type=

recorder.mimeType

||

mimeType

||

"audio/mp4";

const blob=

new Blob(

chunks,

{type}

);

if(recordedUrl){

URL.revokeObjectURL(

recordedUrl

);

}

recordedUrl=

URL.createObjectURL(

blob

);

const audio=

$("audio");

audio.pause();

audio.src=recordedUrl;

audio.hidden=false;

audio.load();

stream?.getTracks().forEach(

t=>t.stop()

);

stream=null;

$("status").textContent=

"録音完了。下の再生ボタンで音声を確認してください。";

};

recorder.start();

$("start").disabled=true;

$("stop").disabled=false;

$("status").textContent=

"🔴 録音中です…";

}

catch(e){

stream?.getTracks().forEach(

t=>t.stop()

);

stream=null;

$("status").textContent=

"マイクを開始できませんでした："

+

e.message;

alert(

"SafariでHTTPSのページを開き、マイクの使用を許可してください。"

);

}

};

$("stop").onclick=()=>{

if(

recorder?.state==="recording"

){

$("status").textContent=

"録音を停止しています…";

recorder.stop();

$("start").disabled=false;

$("stop").disabled=true;

}

};

function lines(text){

return text

.split(/\n+/)

.map(x=>x.trim())

.filter(Boolean);

}

function unique(arr){

return [

...new Set(arr)

];

}

function pick(text,words){

return unique(

lines(text).filter(

line=>

words.some(

w=>line.includes(w)

)

)

);

}

function pickRoles(text){

const roles=[

"PT",

"OT",

"ST",

"理学療法",

"作業療法",

"言語聴覚",

"看護師",

"看護",

"介護職",

"介護",

"ケアマネ",

"ケアマネジャー",

"医師",

"歯科",

"薬剤師",

"リハビリ"

];

return unique(

lines(text).filter(

line=>

roles.some(

w=>line.includes(w)

)

);

}

function without(arr,excluded){

return arr.filter(

line=>!excluded.has(line)

);

}

function show(arr){

return arr.length

?

arr.join("\n")

:

"要確認";

}

$("summarize").onclick=()=>{

const text=

$("text").value.trim();

if(!text){

alert(

"先に会議内容を入力してください。"

);

return;

}

const wishes=

pick(

text,

[

"本人は",

"本人が",

"本人の希望",

"本人の意向",

"希望",

"したい",

"行きたい",

"やりたい",

"家族は",

"家族が",

"家族の希望",

"家族も",

"家族として"

]

);

const professional=

pickRoles(text);

const currentRaw=

pick(

text,

[

"現在",

"状態",

"歩行",

"歩け",

"杖",

"歩行器",

"車椅子",

"立ち上が",

"座位",

"寝返り",

"食事",

"入浴",

"着替",

"トイレ",

"排泄",

"更衣",

"移乗",

"認知",

"血圧",

"ADL",

"自宅"

]

);

const riskRaw=

pick(

text,

[

"課題",

"不安",

"ふらつ",

"転倒",

"リスク",

"困って",

"困る",

"低下",

"難しい",

"危険",

"注意",

"変動",

"問題",

"見守り",

"介助が必要"

]

);

const planRaw=

pick(

text,

[

"今後",

"方針",

"継続",

"訓練",

"支援",

"目標",

"次回",

"再開",

"取り組む",

"必要",

"予定",

"検討"

]

);

const excluded=

new Set(

[

...wishes,

...professional

]

);

const current=

without(

currentRaw,

excluded

);

const risks=

without(

riskRaw,

excluded

);

const plans=

without(

planRaw,

excluded

);

/*

  外出情報は専用に処理。

  「希望」「目標」「専門職の意見」は

  外出欄には入れない。

*/

const outingLines=

pick(

text,

[

"外出",

"買い物",

"スーパー",

"通院",

"地域",

"散歩",

"デイ",

"デイサービス"

]

);

const outing=

without(

outingLines,

new Set([

...wishes,

...professional,

...plans

])

);

const frequency=

pick(

text,

[

"週",

"月",

"毎日",

"毎週",

"月1",

"月2",

"月3",

"月4",

"頻度",

"回程度"

]

);

const transport=

pick(

text,

[

"家族の車",

"自動車",

"車",

"バス",

"タクシー",

"徒歩",

"送迎",

"電車"

]

);

/*

  頻度・手段は

  同じ文章をそのまま表示せず、

  文章から必要な部分だけを取り出す。

*/

let frequencyText="要確認";

for(const line of frequency){

const match=

line.match(

/(?:現在|は)?\s*(週\d+回程度|週\d+回|月\d+回程度|月\d+回|毎日|毎週)/

);

if(match){

frequencyText=

match[1];

break;

}

}

let transportText="要確認";

for(const line of transport){

if(

line.includes("家族の車")

||

line.includes("自動車")

){

transportText="家族の車・自動車";

break;

}

if(line.includes("送迎")){

transportText="送迎";

break;

}

if(line.includes("タクシー")){

transportText="タクシー";

break;

}

if(line.includes("バス")){

transportText="バス";

break;

}

if(line.includes("電車")){

transportText="電車";

break;

}

if(line.includes("徒歩")){

transportText="徒歩";

break;

}

if(line.includes("車")){

transportText="車";

break;

}

}

/*

  外出の希望は②にあるので、

  ⑥では重複させない。

*/

const nextItems=[];

if(risks.length){

nextItems.push(

"・課題・リスクの変化を確認"

);

}

if(wishes.length){

nextItems.push(

"・本人・家族の希望に対する進捗を確認"

);

}

if(professional.length){

nextItems.push(

"・各専門職の支援内容と経過を確認"

);

}

nextItems.push(

"・身体機能・ADLの変化を確認"

);

$("summary").textContent=

`【リハビリテーション会議録（案）】

利用者：${$("name").value||"—"}

会議日：${$("date").value||"—"}

参加者：${$("staff").value||"—"}

【1. 現在の生活・身体状況】

${show(current)}

【2. 本人・家族の希望】

${show(wishes)}

【3. 専門職からの意見】

${show(professional)}

【4. 生活上の課題・リスク】

${show(risks)}

【5. 目標・今後の方針】

${show(plans)}

【6. 外出・地域生活】

${show(outing)}

外出頻度：${frequencyText}

外出手段：${transportText}

【7. 次回までの確認事項】

${nextItems.join("\n")}

※これは会議内容から文章を分類して作成した「案」です。

正式な記録として使用する前に、原文・実際の会議内容と照合して確認してください。`;

};

$("clear").onclick=()=>{

$("text").value="";

$("summary").textContent=

"ここに整理結果が表示されます。";

};

$("copy").onclick=async()=>{

const text=

$("summary").textContent;

if(

!text

||

text==="ここに整理結果が表示されます。"

){

return;

}

try{

await navigator.clipboard.writeText(

text

);

$("copied").textContent=

" コピーしました";

setTimeout(

()=>$("copied").textContent="",

1800

);

}

catch(e){

alert(

"コピーできませんでした。"

);

}

};

</script>

</body>

</html>
