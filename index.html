<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>リハビリ会議アシスト</title>

<style>

*{box-sizing:border-box}

body{

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

  background:#f4f6f8;

  margin:0;

  color:#222;

}

header{

  background:#0b6efd;

  color:white;

  padding:28px 18px;

}

header h1{

  margin:0 0 8px;

  font-size:30px;

}

header p{

  margin:0;

  font-size:17px;

}

main{

  max-width:760px;

  margin:auto;

  padding:14px;

}

.card{

  background:white;

  border-radius:16px;

  padding:18px;

  margin:12px 0;

  box-shadow:0 2px 10px #0001;

}

h2{

  margin-top:0;

}

label{

  display:block;

  font-weight:700;

  margin:12px 0 6px;

}

input,textarea{

  width:100%;

  padding:12px;

  border:1px solid #ccc;

  border-radius:10px;

  font:inherit;

  background:white;

}

textarea{

  min-height:180px;

  resize:vertical;

}

button{

  padding:13px 16px;

  border:0;

  border-radius:10px;

  margin:4px;

  font-weight:700;

  font-size:16px;

}

.primary{

  background:#0b6efd;

  color:white;

}

.secondary{

  background:#e9eef7;

  color:#1f2937;

}

button:disabled{

  opacity:.45;

}

.status{

  padding:12px;

  background:#eef2ff;

  border-radius:10px;

  margin-bottom:10px;

}

.hint{

  font-size:13px;

  color:#64748b;

  line-height:1.5;

}

.privacy{

  font-size:13px;

  color:#334155;

  background:#f8fafc;

  border-radius:10px;

  padding:12px;

  line-height:1.5;

}

.summary{

  white-space:pre-wrap;

  background:#f8fafc;

  border-radius:10px;

  padding:14px;

  line-height:1.7;

  min-height:120px;

}

.row{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

@media(max-width:600px){

  .row{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<header>

<h1>リハビリ会議アシスト</h1>

<p>🎙️ 録音・会議整理テスト版</p>

</header>

<main>

<section class="card">

<h2>🎙️ マイク録音</h2>

<div id="status" class="status">準備OK</div>

<button id="start" class="primary">録音開始</button>

<button id="stop" disabled>録音停止</button>

<audio id="audio" controls hidden style="width:100%;margin-top:12px"></audio>

<p class="hint">

SafariでHTTPSのページとして開き、録音開始時にマイクの使用を「許可」してください。

</p>

<p class="privacy">

🔒 録音データはこのページ内で再生するだけです。

外部サーバーへアップロードする処理は入れていません。

</p>

</section>

<section class="card">

<h2>👤 会議情報</h2>

<div class="row">

<div>

<label for="name">利用者</label>

<input id="name" placeholder="例：Aさん">

</div>

<div>

<label for="date">会議日</label>

<input id="date" type="date">

</div>

</div>

<label for="staff">参加者</label>

<input id="staff" placeholder="例：PT、OT、看護師、介護職、ケアマネ">

</section>

<section class="card">

<h2>📝 会議内容</h2>

<textarea id="text" placeholder="会議内容・文字起こし結果をここに入力します"></textarea>

<p class="hint">

※現在は整理機能のテスト版です。

入力内容を外部AIへ送信せず、このブラウザ内だけで整理します。

</p>

<button id="summarize" class="primary">

会議内容を整理する

</button>

<button id="clear" class="secondary">

クリア

</button>

</section>

<section class="card">

<h2>📋 リハビリ会議録（案）</h2>

<div id="summary" class="summary">

ここに整理結果が表示されます。

</div>

<button id="copy" class="secondary">

結果をコピー

</button>

<span id="copied" class="hint"></span>

</section>

</main>

<script>

let recorder=null;

let stream=null;

let chunks=[];

let recordedUrl=null;

const $=id=>document.getElementById(id);

/* =========================

   録音機能

========================= */

function getSupportedMimeType(){

  const types=[

    "audio/mp4",

    "audio/mp4;codecs=mp4a.40.2",

    "audio/webm;codecs=opus",

    "audio/webm"

  ];

  return types.find(type =>

    typeof MediaRecorder.isTypeSupported==="function" &&

    MediaRecorder.isTypeSupported(type)

  ) || "";

}

$("start").onclick=async()=>{

  try{

    if(!navigator.mediaDevices?.getUserMedia){

      throw new Error("HTTPSで公開されたページではありません");

    }

    if(!window.MediaRecorder){

      throw new Error("このブラウザは録音機能に対応していません");

    }

    stream=await navigator.mediaDevices.getUserMedia({

      audio:true

    });

    chunks=[];

    const mimeType=getSupportedMimeType();

    recorder=mimeType

      ? new MediaRecorder(stream,{mimeType})

      : new MediaRecorder(stream);

    recorder.ondataavailable=e=>{

      if(e.data && e.data.size){

        chunks.push(e.data);

      }

    };

    recorder.onerror=()=>{

      $("status").textContent=

        "録音中にエラーが発生しました。";

    };

    recorder.onstop=()=>{

      const type=

        recorder.mimeType ||

        mimeType ||

        "audio/mp4";

      const blob=new Blob(chunks,{

        type:type

      });

      if(recordedUrl){

        URL.revokeObjectURL(recordedUrl);

      }

      recordedUrl=URL.createObjectURL(blob);

      const audio=$("audio");

      audio.pause();

      audio.src=recordedUrl;

      audio.hidden=false;

      audio.load();

      stream?.getTracks().forEach(t=>t.stop());

      stream=null;

      $("status").textContent=

        "録音完了。下の再生ボタンで音声を確認してください。";

    };

    recorder.start();

    $("start").disabled=true;

    $("stop").disabled=false;

    $("status").textContent=

      "🔴 録音中です…";

  }catch(e){

    stream?.getTracks().forEach(t=>t.stop());

    stream=null;

    $("status").textContent=

      "マイクを開始できませんでした："+e.message;

    alert(

      "SafariでHTTPSのページを開き、マイクの使用を許可してください。"

    );

  }

};

$("stop").onclick=()=>{

  if(recorder?.state==="recording"){

    $("status").textContent=

      "録音を停止しています…";

    recorder.stop();

    $("start").disabled=false;

    $("stop").disabled=true;

  }

};

/* =========================

   会議内容の整理

========================= */

$("summarize").onclick=()=>{

  const text=$("text").value.trim();

  if(!text){

    alert("先に会議内容を入力してください。");

    return;

  }

  const lines=text

    .split(/\n+/)

    .map(line=>line.trim())

    .filter(line=>line.length>0);

  const current=[];

  const wishes=[];

  const professional=[];

  const risks=[];

  const plans=[];

  const outing=[];

  const nextItems=[];

  function has(line,words){

    return words.some(word =>

      line.indexOf(word)!==-1

    );

  }

  for(let i=0;i<lines.length;i++){

    const line=lines[i];

    /* =====================

       ⑦ 次回までの確認

       「次回」が明確な場合だけ

    ===================== */

    if(has(line,[

      "次回までに",

      "次回は",

      "次回確認",

      "次回まで"

    ])){

      nextItems.push(line);

      continue;

    }

    /* =====================

       ③ 専門職

    ===================== */

    if(has(line,[

      "PT",

      "OT",

      "ST",

      "理学療法",

      "作業療法",

      "言語聴覚",

      "看護師",

      "看護",

      "介護職",

      "ケアマネ",

      "医師",

      "薬剤師"

    ])){

      professional.push(line);

      continue;

    }

    /* =====================

       ② 本人・家族の希望

    ===================== */

    if(has(line,[

      "本人は",

      "本人が",

      "本人の希望",

      "本人の意向",

      "本人も",

      "家族は",

      "家族が",

      "家族も",

      "家族の希望",

      "希望して",

      "希望する",

      "希望している",

      "したい",

      "行きたい",

      "やりたい"

    ])){

      wishes.push(line);

      continue;

    }

    /* =====================

       ④ 課題・リスク

       外出が含まれていても

       こちらを優先

    ===================== */

    if(has(line,[

      "課題",

      "ふらつ",

      "転倒",

      "転倒リスク",

      "リスク",

      "不安",

      "困って",

      "困る",

      "低下",

      "難しい",

      "危険",

      "注意が必要",

      "問題",

      "疲れやす",

      "見守りが必要",

      "介助が必要"

    ])){

      risks.push(line);

      continue;

    }

    /* =====================

       ⑤ 目標・今後の方針

       外出が含まれていても

       こちらを優先

    ===================== */

    if(has(line,[

      "今後は",

      "今後",

      "方針",

      "目標とする",

      "目標に",

      "目標",

      "継続する",

      "継続",

      "訓練を",

      "支援を",

      "取り組む",

      "検討する",

      "予定"

    ])){

      plans.push(line);

      continue;

    }

    /* =====================

       ⑥ 外出・地域生活

       具体的な外出内容

    ===================== */

    if(has(line,[

      "外出",

      "買い物",

      "スーパー",

      "通院",

      "地域生活",

      "地域活動",

      "散歩",

      "デイサービス"

    ])){

      outing.push(line);

      continue;

    }

    /* =====================

       ① 現在の生活・身体状況

    ===================== */

    current.push(line);

  }

  /* =========================

     外出頻度

  ========================= */

  let frequency="要確認";

  for(let i=0;i<outing.length;i++){

    const match=outing[i].match(

      /週\s*\d+回程度|週\s*\d+回|月\s*\d+回程度|月\s*\d+回|毎日|毎週/

    );

    if(match){

      frequency=match[0].replace(/\s/g,"");

      break;

    }

  }

  /* =========================

     外出手段

  ========================= */

  let transport="要確認";

  for(let i=0;i<outing.length;i++){

    const line=outing[i];

    if(line.indexOf("家族の車")!==-1){

      transport="家族の車";

      break;

    }

    if(line.indexOf("送迎")!==-1){

      transport="送迎";

      break;

    }

    if(line.indexOf("タクシー")!==-1){

      transport="タクシー";

      break;

    }

    if(line.indexOf("バス")!==-1){

      transport="バス";

      break;

    }

    if(line.indexOf("電車")!==-1){

      transport="電車";

      break;

    }

    if(line.indexOf("徒歩")!==-1){

      transport="徒歩";

      break;

    }

    if(line.indexOf("自動車")!==-1){

      transport="自動車";

      break;

    }

    if(line.indexOf("車")!==-1){

      transport="車";

      break;

    }

  }

  /* =========================

     外出詳細

  ========================= */

  const outingDetails=[];

  for(let i=0;i<outing.length;i++){

    const line=outing[i];

    const isFrequency=

      /週\s*\d+回程度/.test(line) ||

      /週\s*\d+回/.test(line) ||

      /月\s*\d+回程度/.test(line) ||

      /月\s*\d+回/.test(line) ||

      /毎日/.test(line) ||

      /毎週/.test(line);

    const isTransport=

      line.indexOf("家族の車")!==-1 ||

      line.indexOf("送迎")!==-1 ||

      line.indexOf("タクシー")!==-1 ||

      line.indexOf("バス")!==-1 ||

      line.indexOf("電車")!==-1 ||

      line.indexOf("徒歩")!==-1 ||

      line.indexOf("自動車")!==-1;

    if(isFrequency || isTransport){

      continue;

    }

    outingDetails.push(line);

  }

  /* =========================

     重複削除

  ========================= */

  function unique(list){

    const result=[];

    for(let i=0;i<list.length;i++){

      if(result.indexOf(list[i])===-1){

        result.push(list[i]);

      }

    }

    return result;

  }

  function showLines(list){

    const result=unique(list);

    if(!result.length){

      return "要確認";

    }

    return result.join("\n");

  }

  /* =========================

     次回確認事項

  ========================= */

  if(risks.length){

    nextItems.push(

      "・課題・リスクの変化を確認"

    );

  }

  if(wishes.length){

    nextItems.push(

      "・本人・家族の希望に対する進捗を確認"

    );

  }

  if(professional.length){

    nextItems.push(

      "・各専門職の支援内容と経過を確認"

    );

  }

  nextItems.push(

    "・身体機能・ADLの変化を確認"

  );

  /* =========================

     会議録作成

  ========================= */

  const result=

`【リハビリテーション会議録（案）】

利用者：${$("name").value || "—"}

会議日：${$("date").value || "—"}

参加者：${$("staff").value || "—"}

【1. 現在の生活・身体状況】

${showLines(current)}

【2. 本人・家族の希望】

${showLines(wishes)}

【3. 専門職からの意見】

${showLines(professional)}

【4. 生活上の課題・リスク】

${showLines(risks)}

【5. 目標・今後の方針】

${showLines(plans)}

【6. 外出・地域生活】

外出頻度：${frequency}

外出手段：${transport}

${showLines(outingDetails)}

【7. 次回までの確認事項】

${unique(nextItems).join("\n")}

※これは会議内容を自動分類して作成した「案」です。

正式な記録として使用する前に、原文・実際の会議内容と照合して確認してください。`;

  $("summary").textContent=result;

};

/* =========================

   クリア

========================= */

$("clear").onclick=()=>{

  $("text").value="";

  $("summary").textContent=

    "ここに整理結果が表示されます。";

};

/* =========================

   コピー

========================= */

$("copy").onclick=async()=>{

  const text=$("summary").textContent;

  if(

    !text ||

    text==="ここに整理結果が表示されます。"

  ){

    return;

  }

  try{

    await navigator.clipboard.writeText(text);

    $("copied").textContent=

      " コピーしました";

    setTimeout(()=>{

      $("copied").textContent="";

    },1800);

  }catch(e){

    alert("コピーできませんでした。");

  }

};

</script>

</body>

</html>
